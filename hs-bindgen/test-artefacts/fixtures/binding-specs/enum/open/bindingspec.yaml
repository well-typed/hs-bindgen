version:
  hs_bindgen: 1.0.0.0
  binding_specification: '2.0'
hsmodule: Example
ctypes:
- headers: binding-specs/enum/open.h
  cname: enum foo
  hsname: Foo
  enum: open
hstypes:
- hsname: Foo
  representation:
    newtype:
      constructor: Foo
      fields:
      - unwrapFoo
  instances:
  - CEnum
  - Eq
  - Generic
  - HasCField
  - class: HasFFIType
    associated:
    - type: FFIType
      hsmodule: HsBindgen.Runtime.Support
      hsname: CUInt
  - HasField
  - HasFieldCompat
  - HasFieldPtr
  - Ord
  - Prim
  - Read
  - ReadRaw
  - SequentialCEnum
  - Show
  - StaticSize
  - Storable
  - WriteRaw
